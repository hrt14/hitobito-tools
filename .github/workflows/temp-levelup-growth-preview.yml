name: Temporary LEVEL UP growth preview

on:
  pull_request:
    paths:
      - "app/levelup/**"
      - "app/api/levelup/**"
      - "app/levelup-sitemap.xml/**"
      - "app/levelup-robots.txt/**"
      - "components/LevelUpAnalytics.tsx"
      - "proxy.ts"
      - ".github/workflows/temp-levelup-growth-preview.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Vercel secrets
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - run: vercel build --token="$VERCEL_TOKEN"
      - name: Deploy Preview
        run: |
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "preview: $url"
      - name: Verify key routes
        run: |
          echo "$PREVIEW_URL"
