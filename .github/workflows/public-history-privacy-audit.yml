name: Hitobito tools privacy check - one historical candidate
on:
  push:
    branches: [security/public-history-audit-20260919]
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch original refs
        run: |
          set -euo pipefail
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch -q origin '+refs/pull/*/head:refs/remotes/pull/*/head' || true
      - name: Classify single historical blob without exposing content
        run: |
          python3 - <<'PY'
          import json,re,subprocess
          oid='6add387ce51403940582c1fd15f43f48d070d5f8'
          def git(*args):return subprocess.check_output(['git',*args],stderr=subprocess.DEVNULL)
          data=git('cat-file','blob',oid)
          refs=git('for-each-ref','--format=%(refname)','refs/remotes/origin','refs/remotes/pull').decode().splitlines()
          found=[]; source_paths=[]
          for ref in refs:
            if '/security/public-history-audit-' in ref or '/security/privacy-audit-' in ref:continue
            objects=git('rev-list','--objects',ref).decode('utf-8','replace').splitlines()
            matches=[line.split(' ',1)[1] for line in objects if line.startswith(oid+' ')]
            if matches:
              found.append(ref)
              source_paths.extend(matches)
          safe_paths=[p for p in set(source_paths) if re.fullmatch(r'[A-Za-z0-9_./-]+',p) and p.startswith('.github/workflows/')]
          local_pat=re.compile(rb'(?i)(?:/Users/[^/\s]+/|[A-Z]:\\Users\\[^\\\s]+\\)')
          local_matches=local_pat.findall(data)
          local_literals_are_patterns=bool(local_matches) and all(b'[' in x or b'\\' in x or b'example' in x.lower() or b'username' in x.lower() for x in local_matches)
          print(json.dumps({'blob_sha':oid,'size_bytes':len(data),'appears_in_audit_workflow':any(p.startswith('.github/workflows/') for p in source_paths),'safe_workflow_paths':sorted(safe_paths),'audit_script_markers':{'python_git_scanner':b'git(' in data and b're.compile' in data,'regex_category_names':b'family_detail_review' in data and b'local_user_path' in data},'local_path_matches_look_like_regex_or_placeholders':local_literals_are_patterns,'references':{'audit_named':sum('/security/' in r or 'audit' in r for r in found),'other':sum('/security/' not in r and 'audit' not in r for r in found)},'only_original_main':any(r=='refs/remotes/origin/main' for r in found),'caveat':'No actual match values or arbitrary file paths printed; classification is not proof of no exposure.'},sort_keys=True))
          PY