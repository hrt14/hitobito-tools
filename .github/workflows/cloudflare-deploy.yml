name: Cloudflare deploy

# hitobito-tools を Cloudflare Workers (OpenNext) へ公開する。
# 手動起動のみ。Worker の *.workers.dev に公開されるだけで、
# hitobito.jp などの本番ドメインの割り当て・DNS はこのワークフローでは変更しない。
#
# 必要な Actions secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# ビルド時に埋め込む値は Actions variables に置く(未設定なら空のまま):
#   NEXT_PUBLIC_GA_ID, NEXT_PUBLIC_LIFE1_GA_ID, NEXT_PUBLIC_GOOGLE_CLIENT_ID,
#   NEXT_PUBLIC_GOOGLE_PICKER_API_KEY, LIFE1_GOOGLE_SITE_VERIFICATION
# 実行時の秘密値 (ANTHROPIC_API_KEY, EARHUB_ACCESS_CODE など) は
# Cloudflare ダッシュボードの Worker > Settings > Variables and Secrets に置く。
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy to publish the latest main to Cloudflare"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: hitobito-tools-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not configured." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 未設定の変数は空文字ではなく「未定義」のままにする(コード側の ?? による既定値を活かすため)。
      - name: Export build-time variables
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          node -e '
            const vars = JSON.parse(process.env.VARS_JSON || "{}");
            const names = [
              "NEXT_PUBLIC_GA_ID",
              "NEXT_PUBLIC_LIFE1_GA_ID",
              "NEXT_PUBLIC_GOOGLE_CLIENT_ID",
              "NEXT_PUBLIC_GOOGLE_PICKER_API_KEY",
              "LIFE1_GOOGLE_SITE_VERIFICATION",
            ];
            const lines = names.filter((name) => vars[name]).map((name) => `${name}=${vars[name]}`);
            require("fs").appendFileSync(process.env.GITHUB_ENV, lines.map((line) => line + "\n").join(""));
            console.log("set:", names.filter((name) => vars[name]).join(", ") || "(none)");
          '

      - name: Build and deploy
        id: deploy
        run: |
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare deploy 2>&1 | tee deploy.log
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify workers.dev pages
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for path in / /tools /levelup /life1 /drop /2100 /ear-hub/translate; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$URL$path")"
            echo "$path $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Summarize deployment
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Cloudflare deploy"
            echo ""
            echo "- Commit: $GITHUB_SHA"
            echo "- URL: ${URL:-not deployed}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
