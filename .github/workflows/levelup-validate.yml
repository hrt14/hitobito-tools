name: LEVEL UP validate

on:
  push:
    branches: [main]
    paths:
      - "app/levelup/**"
      - "components/LevelUpHomeButton.tsx"
      - ".github/workflows/levelup-validate.yml"
  pull_request:
    paths:
      - "app/levelup/**"
      - "components/LevelUpHomeButton.tsx"
      - ".github/workflows/levelup-validate.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee /tmp/levelup-lint.log
      - name: Report lint failure
        if: steps.lint.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/levelup-lint.log', 'utf8').slice(-12000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### LEVEL UP lint failure\n\n\`\`\`text\n${output}\n\`\`\``
            });
      - name: Stop after lint failure
        if: steps.lint.outcome == 'failure'
        run: exit 1
      - run: npm run build
