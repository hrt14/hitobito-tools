name: LEVEL UP validate

on:
  push:
    branches: [main]
    paths:
      - "app/levelup/**"
      - "components/LevelUpHomeButton.tsx"
      - ".github/workflows/levelup-validate.yml"
  pull_request:
    paths:
      - "app/levelup/**"
      - "components/LevelUpHomeButton.tsx"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
