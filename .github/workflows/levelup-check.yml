name: LEVEL UP temporary check

on:
  push:
    branches:
      - feature/dont-decide-now

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint changed LEVEL UP files
        run: npx eslint app/levelup/dont-decide-now/DontDecideNow.tsx app/levelup/dont-decide-now/page.tsx app/levelup/page.tsx
      - run: npm run build
