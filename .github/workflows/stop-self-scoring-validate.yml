name: Stop self-scoring validate

on:
  push:
    branches: [feat/levelup-stop-self-scoring]
    paths:
      - "app/levelup/stop-self-scoring/**"
      - "app/levelup/page.tsx"
      - ".github/workflows/stop-self-scoring-validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx eslint app/levelup/stop-self-scoring/StopSelfScoringGame.tsx app/levelup/stop-self-scoring/page.tsx app/levelup/page.tsx
      - run: npm run build
