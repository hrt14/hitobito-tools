name: Temporary LEVEL UP growth build

on:
  pull_request:
    paths:
      - "app/levelup/**"
      - "app/api/levelup/**"
      - "app/levelup-sitemap.xml/**"
      - "app/levelup-robots.txt/**"
      - "components/LevelUpAnalytics.tsx"
      - "proxy.ts"
      - ".github/workflows/temp-levelup-growth-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
