name: Validate and export source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate or regenerate package lock
        shell: bash
        run: |
          if ! node -e "JSON.parse(require('fs').readFileSync('package-lock.json','utf8'))"; then
            rm -f package-lock.json
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix: regenerate valid package lock"
            git push
          fi
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Create source archive
        run: tar --exclude=.git --exclude=node_modules --exclude=.next -czf /tmp/source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: hitobito-tools-source
          path: /tmp/source.tar.gz
          retention-days: 1
