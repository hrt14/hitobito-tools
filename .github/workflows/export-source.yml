name: Validate and export source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Lint NEGOTIATOR anger reply
        run: npx eslint app/levelup/anger-reply
      - name: Build
        run: npm run build
      - name: Create source archive
        run: tar --exclude=.git --exclude=node_modules --exclude=.next -czf /tmp/source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: hitobito-tools-source
          path: /tmp/source.tar.gz
          retention-days: 1
