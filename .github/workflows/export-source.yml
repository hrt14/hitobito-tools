name: Export source for deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: tar --exclude=.git --exclude=node_modules --exclude=.next --exclude=source.tar.gz -czf source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: hitobito-tools-source
          path: source.tar.gz
          retention-days: 1
