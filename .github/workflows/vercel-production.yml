name: Vercel production deploy

# DIGIL CLOUD (app/ear-hub) の main 更新だけを既存の hitobito-tools へ自動公開。
# 他アプリの push は自動公開しない。手動実行は従来どおり可能。
# Git Integration / DNS / ドメイン割り当ては変更しない。
on:
  push:
    branches:
      - main
    paths:
      - "app/ear-hub/**"
      - ".github/workflows/vercel-production.yml" # この自動化を有効にするマージも検証する
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy to publish the latest main to production"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: hitobito-tools-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.confirm == 'deploy')
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_vCUqyPcmj2xuDuBM7f7aOiMQ
      VERCEL_PROJECT_ID: prj_UXim4rDyF8jqIIe2TFZO8eUP5PZl
    steps:
      - name: Check deployment credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not configured in this repository." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check DIGIL CLOUD code
        run: npx eslint app/ear-hub/MultilingualTranslatePage.tsx app/ear-hub/TwoLanguageTranslatePage.tsx app/ear-hub/MinutesPage.tsx app/ear-hub/minutes-google-docs.ts app/ear-hub/multilingual-languages.ts app/ear-hub/multilingual-translator.ts app/ear-hub/'[module]'/page.tsx

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel settings (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify existing project target
        run: |
          node -e 'const p = require("./.vercel/project.json"); if (p.projectId !== process.env.VERCEL_PROJECT_ID || p.orgId !== process.env.VERCEL_ORG_ID) { throw new Error("Incorrect Vercel project/team: aborting production deployment"); }'

      - name: Build for production
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production (archive to respect upload quota)
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify DIGIL CLOUD production pages
        run: |
          translate="$(mktemp)"
          minutes="$(mktemp)"
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --location --max-time 20 \
              'https://dc.hitobito.jp/translate' --output "$translate" \
              && grep -Fq 'id="my-language"' "$translate" \
              && grep -Fq 'id="partner-language"' "$translate" \
              && grep -Fq '自分の画面' "$translate" \
              && grep -Fq '相手の画面' "$translate" \
              && curl --fail --silent --show-error --location --max-time 20 \
              'https://dc.hitobito.jp/minutes' --output "$minutes" \
              && grep -Fq 'Googleドキュメントに保存' "$minutes" \
              && grep -Fq '保存した議事録' "$minutes"; then
              echo 'DIGIL CLOUD: translation and minutes pages returned HTTP 200 with the expected UI.'
              exit 0
            fi
            echo "Production is not serving the expected DIGIL CLOUD UI yet ($attempt/15)."
            sleep 5
          done
          echo 'Production verification failed; check Vercel deployment and domain routing.' >&2
          exit 1

      - name: Summarize deployment
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Production deploy"
            echo ""
            echo "- Commit: $GITHUB_SHA"
            echo "- Deployment URL: ${URL:-not deployed}"
            echo "- Verification: ${{ job.status }}"
            echo "- Check: https://dc.hitobito.jp/translate"
            echo "- Check: https://dc.hitobito.jp/minutes"
          } >> "$GITHUB_STEP_SUMMARY"
