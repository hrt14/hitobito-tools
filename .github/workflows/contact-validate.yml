name: Hitobito contact validation

on:
  pull_request:
    paths:
      - 'standalone/contact/**'
      - 'proxy.ts'
      - '.github/workflows/contact-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Worker syntax and regression tests
        run: npm run check
        working-directory: standalone/contact
      - name: Install portal dependencies
        run: npm ci --ignore-scripts
      - name: Lint contact changes
        run: npx eslint proxy.ts standalone/contact/worker/index.mjs
      - name: Repository lint (pre-existing issues reported, non-blocking for contact)
        continue-on-error: true
        run: npm run lint
      - name: Portal production build
        run: npm run build
