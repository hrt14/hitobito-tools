name: Deploy Search Console verification

on:
  push:
    paths:
      - ".github/workflows/deploy-search-console-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_vCUqyPcmj2xuDuBM7f7aOiMQ
      VERCEL_PROJECT_ID: prj_UXim4rDyF8jqIIe2TFZO8eUP5PZl
    steps:
      - uses: actions/checkout@v6

      - name: Check Vercel token
        run: |
          test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN secret is not configured" >&2; exit 1)

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link project
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_vCUqyPcmj2xuDuBM7f7aOiMQ","projectId":"prj_UXim4rDyF8jqIIe2TFZO8eUP5PZl"}' > .vercel/project.json

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy production
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Verify Search Console HTML file
        run: |
          BODY="$(curl -fsSL https://levelup.hitobito.jp/google4a20d374a163ef3d.html)"
          test "$BODY" = 'google-site-verification: google4a20d374a163ef3d.html'

      - name: Verify Search Console meta tag
        run: |
          curl -fsSL https://levelup.hitobito.jp/ | grep -F 'google-site-verification' | grep -F 'sPBsbYpwHySgc4VntENvvGC4M--IgVcITX__dUozokA'
