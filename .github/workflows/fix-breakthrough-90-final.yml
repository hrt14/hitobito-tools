name: Fix breakthrough 90 final

on:
  push:
    branches: [fix/breakthrough-90-final]

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/breakthrough-90-final
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch final lint issues
        run: |
          python - <<'PY'
          from pathlib import Path

          grid_path = Path('app/levelup/LevelUpCatalogGrid.tsx')
          grid = grid_path.read_text()
          grid = grid.replace('const EMPTY_FAVORITES = "[]";\nlet fallbackFavorites = EMPTY_FAVORITES;\n', 'const EMPTY_FAVORITES = "[]";\n')
          grid = grid.replace('return window.localStorage.getItem(FAVORITES_STORAGE_KEY) ?? fallbackFavorites;', 'return window.localStorage.getItem(FAVORITES_STORAGE_KEY) ?? EMPTY_FAVORITES;')
          grid = grid.replace('return fallbackFavorites;', 'return EMPTY_FAVORITES;')
          grid = grid.replace('    fallbackFavorites = serialized;\n\n', '')
          grid_path.write_text(grid)

          app_path = Path('app/levelup/breakthrough-90/Breakthrough90.tsx')
          app = app_path.read_text()
          app = app.replace('import { useEffect, useMemo, useRef, useState } from "react";\n', 'import Link from "next/link";\nimport { useEffect, useMemo, useRef, useState } from "react";\n')
          old_effect = '''  useEffect(() => {\n    try {\n      const raw = window.localStorage.getItem(STORAGE_KEY);\n      if (!raw) return;\n      const parsed = JSON.parse(raw) as SavedSession;\n      if (parsed && typeof parsed.nextAction === "string") setLastSession(parsed);\n    } catch {\n      // Storage is optional. The core experience still works without it.\n    }\n  }, []);'''
          new_effect = '''  useEffect(() => {\n    const timer = window.setTimeout(() => {\n      try {\n        const raw = window.localStorage.getItem(STORAGE_KEY);\n        if (!raw) return;\n        const parsed = JSON.parse(raw) as SavedSession;\n        if (parsed && typeof parsed.nextAction === "string") setLastSession(parsed);\n      } catch {\n        // Storage is optional. The core experience still works without it.\n      }\n    }, 0);\n\n    return () => window.clearTimeout(timer);\n  }, []);'''
          if old_effect not in app:
              raise SystemExit('expected storage effect not found')
          app = app.replace(old_effect, new_effect)
          app = app.replace('<a className={styles.homeLink} href="/" aria-label="LEVEL UPトップへ戻る">\n          <span aria-hidden="true">←</span><span>LEVEL UP</span>\n        </a>', '<Link className={styles.homeLink} href="/" aria-label="LEVEL UPトップへ戻る">\n          <span aria-hidden="true">←</span><span>LEVEL UP</span>\n        </Link>')
          app = app.replace('<a className={styles.textLink} href="/">LEVEL UPに戻る</a>', '<Link className={styles.textLink} href="/">LEVEL UPに戻る</Link>')
          app_path.write_text(app)
          PY
      - run: npm ci
      - name: Lint changed LEVEL UP files
        run: npx eslint app/levelup/breakthrough-90/Breakthrough90.tsx app/levelup/LevelUpCatalogGrid.tsx
      - name: Build
        run: npm run build
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/levelup/breakthrough-90/Breakthrough90.tsx app/levelup/LevelUpCatalogGrid.tsx
          git commit -m "Fix breakthrough 90 final lint issues"
          git push origin HEAD:fix/breakthrough-90-final
