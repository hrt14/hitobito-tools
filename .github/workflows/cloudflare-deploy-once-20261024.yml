name: Cloudflare deploy once (portal redesign)

# hitobito-tools を Cloudflare Workers (OpenNext) へ公開する。
# 手動起動のみ。Worker の *.workers.dev に公開されるだけで、
# hitobito.jp などの本番ドメインの割り当て・DNS はこのワークフローでは変更しない。
#
# 必要な Actions secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# ビルド時に埋め込む値は Actions variables に置く(未設定なら空のまま):
#   NEXT_PUBLIC_GA_ID, NEXT_PUBLIC_LIFE1_GA_ID, NEXT_PUBLIC_GOOGLE_CLIENT_ID,
#   NEXT_PUBLIC_GOOGLE_PICKER_API_KEY, LIFE1_GOOGLE_SITE_VERIFICATION
# 実行時の秘密値 (ANTHROPIC_API_KEY, EARHUB_ACCESS_CODE など) は
# Cloudflare ダッシュボードの Worker > Settings > Variables and Secrets に置く。
# One-time deployment for the approved hitobito.jp portal redesign.
# Only a push creating/updating this exact workflow file can trigger it.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-deploy-once-20261024.yml"

permissions:
  contents: read

concurrency:
  group: hitobito-tools-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not configured." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 未設定の変数は空文字ではなく「未定義」のままにする(コード側の ?? による既定値を活かすため)。
      - name: Export build-time variables
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          node -e '
            const vars = JSON.parse(process.env.VARS_JSON || "{}");
            const names = [
              "NEXT_PUBLIC_GA_ID",
              "NEXT_PUBLIC_LIFE1_GA_ID",
              "NEXT_PUBLIC_GOOGLE_CLIENT_ID",
              "NEXT_PUBLIC_GOOGLE_PICKER_API_KEY",
              "LIFE1_GOOGLE_SITE_VERIFICATION",
            ];
            const lines = names.filter((name) => vars[name]).map((name) => `${name}=${vars[name]}`);
            require("fs").appendFileSync(process.env.GITHUB_ENV, lines.map((line) => line + "\n").join(""));
            console.log("set:", names.filter((name) => vars[name]).join(", ") || "(none)");
          '

      - name: Build and deploy
        id: deploy
        run: |
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare deploy 2>&1 | tee deploy.log
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify workers.dev pages
        env:
          URL: ${{ steps.deploy.outputs.url }}
        # 公開直後は workers.dev への反映に数十秒かかり 404 が返るので、待ちながら確認する。
        run: |
          for path in / /tools /levelup /life1 /drop /2100 /ear-hub/translate; do
            for attempt in $(seq 1 12); do
              code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$URL$path")"
              [ "$code" = "200" ] && break
              echo "$path $code ($attempt/12)"
              sleep 10
            done
            echo "$path $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Verify actual hitobito.jp production portal
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            curl --silent --fail --show-error --max-time 20 https://hitobito.jp/ -o /tmp/hitobito-home.html || true
            if grep -Fq '小さなアイデアを' /tmp/hitobito-home.html               && grep -Fq '近所の価格' /tmp/hitobito-home.html               && ! grep -Fq 'アプリを見つける' /tmp/hitobito-home.html; then
              echo 'Production hitobito.jp displays the redesigned portal.'
              exit 0
            fi
            echo "The domain is still serving older content ($attempt/15)."
            sleep 10
          done
          echo 'Workers deployed, but the live domain did not display the redesign.' >&2
          exit 1

      - name: Summarize deployment
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Cloudflare deploy"
            echo ""
            echo "- Commit: $GITHUB_SHA"
            echo "- URL: ${URL:-not deployed}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
