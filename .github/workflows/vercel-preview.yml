name: Vercel preview deploy

# Vercel の Git Integration を止めたまま Preview Deployment を作る経路。
# GitHub のランナーから Vercel を叩くので、エージェント側のネットワーク制限を受けない。
#
# 手動起動のみ(workflow_dispatch)。default branch にこのファイルがあることが前提。
# 必要な Actions secret は VERCEL_TOKEN のみ。
# Team ID / Project ID は秘匿情報ではないため、既存プロジェクト hitobito-tools を
# 指すようここに固定している(別プロジェクトへ誤デプロイしないため)。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hitobito-tools-vercel-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_vCUqyPcmj2xuDuBM7f7aOiMQ
      VERCEL_PROJECT_ID: prj_UXim4rDyF8jqIIe2TFZO8eUP5PZl
    steps:
      - name: Check deployment credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not configured in this repository." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # プロジェクト設定と Preview 環境の環境変数を取り込む(Production は触らない)。
      - name: Pull Vercel settings (preview)
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Show preview URL
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          id="$(vercel inspect "$URL" --token="$VERCEL_TOKEN" 2>&1 | grep -oE 'dpl_[A-Za-z0-9]+' | head -1 || true)"
          {
            echo "## Preview"
            echo ""
            echo "- Commit: $GITHUB_SHA"
            echo "- Deployment ID: ${id:-unknown}"
            echo "- URL: $URL"
            echo "- DIGIL CLOUD: $URL/ear-hub/translate"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "preview: $URL (commit $GITHUB_SHA, id ${id:-unknown})"
