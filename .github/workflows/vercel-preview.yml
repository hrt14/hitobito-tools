name: Vercel preview deploy

# Vercel の Git Integration を止めたまま Preview Deployment を作るための予備経路。
# GitHub のランナーから Vercel を叩くので、エージェント側のネットワーク制限を受けない。
#
# DIGIL CLOUD の検証中は対象ブランチへの push でまず通常ビルドを検証する。
# Vercel用Secretsがある場合だけ、その後Preview Deploymentも作る。
# 必要な Actions secrets: VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID
on:
  workflow_dispatch:
  push:
    branches:
      - claude/earphone-extension-app-concept-184mbe

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Check Vercel secrets
        id: vercel-secrets
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets are not configured; build verification completed, preview deploy skipped."
          fi

      - name: Install Vercel CLI
        if: steps.vercel-secrets.outputs.available == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel settings
        if: steps.vercel-secrets.outputs.available == 'true'
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build for Vercel
        if: steps.vercel-secrets.outputs.available == 'true'
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        if: steps.vercel-secrets.outputs.available == 'true'
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Show preview URL
        if: steps.vercel-secrets.outputs.available == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Preview URL"
            echo ""
            echo "- $URL"
            echo "- Ear Hub: $URL/ear-hub"
            echo "- Translate: $URL/ear-hub/translate"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "preview: $URL"
