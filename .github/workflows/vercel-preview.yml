name: Vercel preview deploy

# Vercel の Git Integration を止めたまま Preview Deployment を作るための予備経路。
# GitHub のランナーから Vercel を叩くので、エージェント側のネットワーク制限を受けない。
#
# 常用は Vercel MCP 側に任せているので、ここでは自動起動しない。
# 使うときは、このファイルを default branch に置いたうえで手動起動する
# (workflow_dispatch は default branch にファイルが無いと dispatch できない)。
# 必要な Actions secrets: VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "リポジトリの Actions secrets が足りません:$missing" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # プロジェクト設定と Preview 環境の環境変数を取り込む。
      # NEXT_PUBLIC_* はここで取れた値がビルド時に埋め込まれる。
      - name: Pull Vercel settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Show preview URL
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Preview URL"
            echo ""
            echo "- $URL"
            echo "- Ear Hub: $URL/ear-hub"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "preview: $URL"
