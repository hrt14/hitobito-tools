name: Vercel preview deploy

# Vercel の Git Integration とは別経路。こちらがOFFのままでも Preview Deployment を作れる。
#
# workflow_dispatch は default branch にファイルが無いと起動できないため、
# main を触らずに動かせるよう push トリガーにしてある。
# 無料枠を使うので、対象ブランチと対象パスを絞って、関係ない変更では動かさない。
on:
  push:
    branches:
      - claude/earphone-extension-app-concept-184mbe
    paths:
      - "app/ear-hub/**"
      - "app/api/ear-hub/**"
      - ".github/workflows/vercel-preview.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "リポジトリの Actions secrets が足りません:$missing" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # プロジェクト設定と Preview 環境の環境変数を取り込む。
      # NEXT_PUBLIC_* はここで取れた値がビルド時に埋め込まれる。
      - name: Pull Vercel settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Show preview URL
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Preview URL"
            echo ""
            echo "- $URL"
            echo "- Ear Hub: $URL/ear-hub"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "preview: $URL"
