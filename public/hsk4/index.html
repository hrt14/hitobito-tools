<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK4 中国語トレーナー</title>
<link rel="manifest" href="/hsk4/manifest.webmanifest">
<link rel="apple-touch-icon" href="/hsk4/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="中国語">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#c8372d">
<meta name="robots" content="noindex">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1d1f;--sub:#6b6b70;--line:#e4e0d8;--accent:#c8372d;--ok:#2e7d4f;--ng:#c8372d;--soft:#fbeeec}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--card:#222;--ink:#f2f2f2;--sub:#a0a0a5;--line:#333;--soft:#3a2523}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","PingFang SC",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:18px;margin:4px 0 2px}
h2{font-size:19px;margin:0 0 10px}
.small{font-size:13px;color:var(--sub)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.tabs button{padding:10px 2px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:13px}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 10px}.seg button{padding:7px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-size:13px}.seg button.on{background:var(--ink);color:var(--bg)}
.autobox{text-align:center;padding:10px 0}.autobox .jp{font-size:20px}.autobox .zh{font-size:28px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:220px}
.jp{font-size:18px;line-height:1.6}
.zh{font-size:25px;line-height:1.5;margin-top:12px;font-family:"PingFang SC","Hiragino Sans GB",sans-serif}
.py{font-size:16px;color:var(--sub);margin-top:4px}
.note{font-size:14px;background:var(--soft);border-radius:8px;padding:10px;margin-top:12px;line-height:1.6}
.body{white-space:pre-wrap;font-size:15px;line-height:1.75}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;padding:13px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;min-width:84px}
.btn.main{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.ng{background:var(--ng);color:#fff;border-color:var(--ng)}
.btn.sm{flex:none;padding:7px 10px;font-size:13px;min-width:0}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.opt.right{border-color:var(--ok);background:rgba(46,125,79,.14)}
.opt.wrong{border-color:var(--ng);background:rgba(200,55,45,.14)}
.opt.picked{border-color:var(--ink);background:rgba(127,127,127,.15)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--sub);gap:8px}
.speed button{padding:4px 8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font-size:12px;margin-left:3px}
.speed button.on{background:var(--ink);color:var(--bg)}
.hide{display:none!important}
.big{font-size:40px;text-align:center;margin:16px 0}
.list .item{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);gap:8px}
.list .item:last-child{border-bottom:0}
.item .h{font-size:20px;font-family:"PingFang SC",sans-serif}
.item .m{font-size:13px;color:var(--sub)}
.lesson{display:block;width:100%;text-align:left;padding:12px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font-size:15px}
.lesson .p{float:right;font-size:12px;color:var(--sub)}
.ex{padding:8px 0;border-top:1px dashed var(--line)}
input[type=search]{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);font-size:16px;background:var(--card);color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
textarea{width:100%;height:220px;font-size:13px;border-radius:8px;border:1px solid var(--line);padding:8px;background:var(--card);color:var(--ink)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--accent)}
.lk{color:var(--accent);text-decoration:underline;background:none;border:0;padding:0;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<h1>中国語トレーナー <span class="small">HSK4・v3</span></h1>
<div class="small" id="stat"></div>
<div class="tabs" id="tabs">
<button data-m="auto">▶オート</button>
<button data-m="comp" class="on">即座作文</button>
<button data-m="listen">聞き取り</button>
<button data-m="gram">文法</button>
<button data-m="vocab">単語</button>
<button data-m="test">テスト</button>
<button data-m="weak">苦手・記録</button>
</div>
<div class="bar"><span id="mode-desc"></span><span class="speed">速度<button data-r="0.6">遅</button><button data-r="0.8" class="on">中</button><button data-r="1.0">速</button></span></div>
<div class="card" id="card"></div>
<div class="small" style="margin-top:12px;line-height:1.6"><span id="off">オフライン準備中…</span><br>音声はiPhone内蔵の中国語音声を使います。音が出ない場合は「設定→アクセシビリティ→読み上げコンテンツ→声→中国語」で声をダウンロードしてください。<br>ホーム画面に追加：Safariの共有ボタン→「ホーム画面に追加」。</div>
</div>
<div class="modal hide" id="modal"><div class="sheet" id="sheet"></div></div>
<script src="/hsk4/data-grammar.js"></script>
<script src="/hsk4/data-sentences.js"></script>
<script src="/hsk4/data-vocab.js"></script>
<script>
const S=window.SENT, L=window.LESSONS, GQ=window.GQ;
const V=[];{const seen=new Set();for(const v of window.VOCAB){if(v.length>=3&&!seen.has(v[0])){seen.add(v[0]);V.push(v)}}}
const LMAP=Object.fromEntries(L.map(l=>[l.id,l]));
const C=document.getElementById("card");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let weak=store.get("zh_weak",{}),done=store.get("zh_done",0),hist=store.get("zh_hist",{}),tests=store.get("zh_tests",[]);
let rate=0.8,mode="comp";
function save(){store.set("zh_weak",weak);store.set("zh_done",done);store.set("zh_hist",hist);store.set("zh_tests",tests);stat()}
function stat(){const n=Object.values(weak).filter(x=>x>0).length;document.getElementById("stat").textContent=`練習した数：${done}　苦手：${n}　単語：${V.length}語　文法：${L.length}課`}
function mark(key,ok){done++;weak[key]=Math.max(0,(weak[key]||0)+(ok?-1:2));const h=hist[key]||[0,0];h[ok?0:1]++;hist[key]=h;save()}
let zhVoice=null,jaVoice=null;
function loadVoice(){try{const v=speechSynthesis.getVoices();zhVoice=v.find(x=>/zh[-_]CN/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null;jaVoice=v.find(x=>/^ja/i.test(x.lang))||null}catch(e){}}
if("speechSynthesis" in window){loadVoice();speechSynthesis.onvoiceschanged=loadVoice}
function say(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/——/g,"，"));u.lang="zh-CN";if(zhVoice)u.voice=zhVoice;u.rate=rate;speechSynthesis.speak(u)}
function stop(){try{speechSynthesis.cancel()}catch(e){}}
// ---------- オート再生 ----------
const AUTO=Object.assign({src:"sent",flow:"jz",reps:2,gap:3,order:"rnd",py:true},store.get("zh_auto",{}));
let autoRun={on:false,tok:0,list:[],i:0,lock:null};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function ttsP(text,lang,r){return new Promise(res=>{if(!("speechSynthesis" in window))return res();const u=new SpeechSynthesisUtterance(text.replace(/——/g,"，"));u.lang=lang;const v=lang==="zh-CN"?zhVoice:jaVoice;if(v)u.voice=v;u.rate=r;let d=false;const fin=()=>{if(!d){d=true;clearTimeout(t);res()}};u.onend=fin;u.onerror=fin;const t=setTimeout(fin,2500+text.length*450/r);speechSynthesis.speak(u)})}
function autoItems(){
  let a;
  if(AUTO.src==="sent")a=S.map(x=>({jp:x[0],zh:x[1],py:x[2]}));
  else if(AUTO.src==="ex")a=L.flatMap(l=>l.ex.map(e=>({jp:e[2],zh:e[0],py:e[1],t:l.t})));
  else if(AUTO.src==="vocab")a=V.map(v=>({jp:v[2],zh:v[0],py:v[1]}));
  else a=[...S.filter(x=>(weak["s:"+x[1]]||0)>0||(weak["l:"+x[1]]||0)>0).map(x=>({jp:x[0],zh:x[1],py:x[2]})),...V.filter(v=>(weak["v:"+v[0]]||0)>0).map(v=>({jp:v[2],zh:v[0],py:v[1]}))];
  return AUTO.order==="rnd"?shuffle(a):a;
}
const AOPT={src:[["sent","作文の文"],["ex","文法の例文"],["vocab","単語"],["weak","苦手だけ"]],flow:[["jz","日→中（即座作文）"],["z","中だけ（聞き流し）"],["zj","中→日"]],reps:[[1,"1回"],[2,"2回"],[3,"3回"]],gap:[[2,"2秒"],[3,"3秒"],[5,"5秒"]],order:[["rnd","ランダム"],["seq","順番"]],py:[[true,"表示"],[false,"隠す"]]};
const ALBL={src:"素材",flow:"流れ",reps:"中国語の回数",gap:"間（言う時間）",order:"順番",py:"ピンイン"};
function autoMenu(){
  autoStop();
  C.innerHTML=`<div class="autobox" id="ab"><div class="small">▶を押すと、手を使わずに流れ続けます</div></div>
  <div class="row" style="margin-top:4px"><button class="btn sm" id="prev">⏮</button><button class="btn main" id="tog">▶ 再生</button><button class="btn sm" id="nxt">⏭</button></div>
  <div id="cnt" class="small" style="text-align:center;margin-top:6px"></div>
  <div style="margin-top:14px">${Object.keys(AOPT).map(k=>`<div class="small">${ALBL[k]}</div><div class="seg">${AOPT[k].map(([v,l])=>`<button data-k="${k}" data-v="${v}" class="${String(AUTO[k])===String(v)?"on":""}">${l}</button>`).join("")}</div>`).join("")}</div>
  <div class="note">画面をつけたままにしてください。ロックやアプリの切り替えで止まります（再開は▶）。イヤホン推奨。</div>`;
  C.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{const k=b.dataset.k;let v=b.dataset.v;if(k==="reps"||k==="gap")v=+v;if(k==="py")v=v==="true";AUTO[k]=v;store.set("zh_auto",AUTO);const was=autoRun.on;autoStop();autoMenu();if(was)autoStart()});
  $("tog").onclick=()=>autoRun.on?autoStop(true):autoStart();
  $("nxt").onclick=()=>{autoRun.i++;if(autoRun.on)autoStart(true);else autoShow(autoRun.list[autoRun.i%autoRun.list.length],false)};
  $("prev").onclick=()=>{autoRun.i=Math.max(0,autoRun.i-1);if(autoRun.on)autoStart(true);else autoShow(autoRun.list[autoRun.i%autoRun.list.length],false)};
  autoRun.list=autoItems();autoRun.i=0;
  if(!autoRun.list.length){$("ab").innerHTML=`<div class="small">苦手はまだありません。別の素材を選んでください。</div>`;$("tog").disabled=true}
}
function autoShow(it,hideZh){
  if(!it)return;const ab=$("ab");if(!ab)return;
  ab.innerHTML=`${it.t?`<div class="small">${esc(it.t)}</div>`:""}<div class="jp">${esc(it.jp)}</div><div id="azh" class="${hideZh?"hide":""}"><div class="zh">${esc(it.zh)}</div>${AUTO.py?`<div class="py">${esc(it.py)}</div>`:""}</div>`;
  const c=$("cnt");if(c)c.textContent=`${(autoRun.i%autoRun.list.length)+1} / ${autoRun.list.length}`;
}
async function wakeOn(){try{if("wakeLock" in navigator&&!autoRun.lock){autoRun.lock=await navigator.wakeLock.request("screen");autoRun.lock.addEventListener("release",()=>{autoRun.lock=null})}}catch(e){}}
function wakeOff(){try{autoRun.lock&&autoRun.lock.release()}catch(e){}autoRun.lock=null}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&autoRun.on)wakeOn()});
function autoStart(restart){
  if(!autoRun.list.length)return;
  autoRun.on=true;const tok=++autoRun.tok;stop();wakeOn();
  const t=$("tog");if(t)t.textContent="⏸ 一時停止";
  (async()=>{
    while(autoRun.on&&tok===autoRun.tok){
      const it=autoRun.list[autoRun.i%autoRun.list.length];
      const alive=()=>autoRun.on&&tok===autoRun.tok;
      const zh=async n=>{for(let k=0;k<n&&alive();k++){await ttsP(it.zh,"zh-CN",rate);if(k<n-1&&alive())await wait(700)}};
      if(AUTO.flow==="jz"){autoShow(it,true);await ttsP(it.jp,"ja-JP",1.05);if(!alive())break;await wait(AUTO.gap*1000);if(!alive())break;const z=$("azh");if(z)z.classList.remove("hide");await zh(AUTO.reps)}
      else if(AUTO.flow==="z"){autoShow(it,false);await zh(AUTO.reps)}
      else{autoShow(it,false);await ttsP(it.zh,"zh-CN",rate);if(!alive())break;await wait(500);await ttsP(it.jp,"ja-JP",1.05);if(!alive())break;await wait(500);await zh(Math.max(1,AUTO.reps-1))}
      if(!alive())break;await wait(AUTO.flow==="z"?AUTO.gap*500:1200);if(!alive())break;
      autoRun.i++;if(autoRun.i>0&&autoRun.i%autoRun.list.length===0&&AUTO.order==="rnd")autoRun.list=shuffle(autoRun.list);
    }
  })();
}
function autoStop(pauseOnly){autoRun.on=false;autoRun.tok++;stop();wakeOff();const t=$("tog");if(t)t.textContent="▶ 再生"}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(pool,keyf){const w=pool.map(x=>1+3*(weak[keyf(x)]||0));const t=w.reduce((a,b)=>a+b,0);let r=Math.random()*t;for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i]}return pool[pool.length-1]}
const $=id=>document.getElementById(id);
const gkey=g=>"g:"+g[1]+"|"+g[2][0];

// ---------- 辞書（困ったとき） ----------
function wordsIn(text){const out=[];for(const v of V){if(v[0].length>=2&&text.includes(v[0]))out.push(v)}return out.slice(0,12)}
function openSheet(html){$("sheet").innerHTML=html+`<div class="row"><button class="btn" id="closeSheet">閉じる</button></div>`;$("modal").classList.remove("hide");$("closeSheet").onclick=closeSheet}
function closeSheet(){$("modal").classList.add("hide")}
$("modal").onclick=e=>{if(e.target.id==="modal")closeSheet()};
function help(text,lid){
  const ws=wordsIn(text);let h=`<h2>📖 ヒント</h2>`;
  if(ws.length)h+=`<div class="small">この文の単語</div><div class="list">${ws.map(v=>`<div class="item"><div><div class="h">${esc(v[0])}</div><div class="m">${esc(v[1])}　${esc(v[2])}</div></div><button class="btn sm" data-say="${esc(v[0])}">🔊</button></div>`).join("")}</div>`;
  else h+=`<div class="small">単語帳に載っている単語は見つかりませんでした。</div>`;
  if(lid&&LMAP[lid])h+=`<div class="note">関連する文法：<button class="lk" data-lesson="${lid}">${esc(LMAP[lid].t)}</button></div>`;
  openSheet(h);
  $("sheet").querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
  $("sheet").querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>{closeSheet();lessonSheet(b.dataset.lesson)});
}
function lessonSheet(id){
  const l=LMAP[id];openSheet(lessonHTML(l));bindEx($("sheet"));
}
function lessonHTML(l){return `<h2>${esc(l.t)}</h2><div class="body">${esc(l.b)}</div><div style="margin-top:12px">${l.ex.map(e=>`<div class="ex"><div class="zh" style="font-size:20px;margin:0">${esc(e[0])} <button class="btn sm" data-say="${esc(e[0])}">🔊</button></div><div class="py">${esc(e[1])}</div><div class="small">${esc(e[2])}</div></div>`).join("")}</div>`}
function bindEx(root){root.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say))}

// ---------- 即座作文 ----------
function comp(item,after){
  const [jp,zh,py,nt,lid]=item;
  C.innerHTML=`<div class="jp">${esc(jp)}</div><div id="ans" class="hide"><div class="zh">${esc(zh)}</div><div class="py">${esc(py)}</div>${nt?`<div class="note">${esc(nt)}</div>`:""}</div>
  <div class="row" id="r1"><button class="btn main" id="show">答えを見る</button><button class="btn sm" id="hint">📖</button></div>
  <div class="row hide" id="r2"><button class="btn" id="play">🔊 もう一度</button><button class="btn sm" id="hint2">📖 単語・文法</button></div>
  <div class="row hide" id="r3"><button class="btn ng" id="ng">✕ 言えなかった</button><button class="btn ok" id="ok">○ 言えた</button></div>`;
  $("hint").onclick=()=>help(zh,lid);$("hint2").onclick=()=>help(zh,lid);
  $("show").onclick=()=>{["ans","r2","r3"].forEach(i=>$(i).classList.remove("hide"));$("r1").classList.add("hide");say(zh)};
  $("play").onclick=()=>say(zh);
  $("ok").onclick=()=>{mark("s:"+zh,true);(after||next)()};$("ng").onclick=()=>{mark("s:"+zh,false);(after||next)()};
}
// ---------- 聞き取り ----------
function listenQ(item){const opts=shuffle([item,...shuffle(S.filter(x=>x!==item)).slice(0,3)]);return {kind:"listen",item,opts,key:"l:"+item[1],cat:"聞き取り",lid:item[4]}}
function vocabQ(v){const opts=shuffle([v,...shuffle(V.filter(x=>x!==v)).slice(0,3)]);return {kind:"vocab",item:v,opts,key:"v:"+v[0],cat:"単語",lid:""}}
function gramQ(g){return {kind:"gram",item:g,opts:shuffle(g[2].map((c,i)=>i)),key:gkey(g),cat:"文法",lid:g[0]}}
function fullSentence(g){return g[1].includes("（　）")?g[1].replace("（　）",g[2][0]).replace(/（[^）]*）$/,""):g[2][0]}
// 選択問題の共通描画（test=trueなら答えを見せない）
function renderMC(q,{test=false,onDone,head=""}={}){
  let html=head;
  if(q.kind==="listen"){html+=`<div class="big" style="margin:8px 0"><button class="btn main" id="play" style="width:100%;font-size:20px">🔊 聞く</button></div>${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o[0])}</button>`).join("")}`}
  else if(q.kind==="vocab"){html+=`<div class="zh" style="margin:4px 0;font-size:34px">${esc(q.item[0])} <button class="btn sm" id="play">🔊</button></div><div class="small">意味はどれ？</div>${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o[2])}</button>`).join("")}`}
  else {html+=`<div class="zh" style="margin-top:0;font-size:22px">${esc(q.item[1])}</div>${q.opts.map(i=>`<button class="opt" data-i="${i}">${esc(q.item[2][i])}</button>`).join("")}`}
  html+=`<div id="ans" class="hide"></div>`;
  C.innerHTML=html;
  const speakText=q.kind==="listen"?q.item[1]:q.kind==="vocab"?q.item[0]:fullSentence(q.item);
  if($("play")){$("play").onclick=()=>say(speakText)}
  if(q.kind==="listen")setTimeout(()=>say(speakText),250);
  let answered=false;
  C.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(answered)return;answered=true;
    const i=+b.dataset.i;let good,picked,correct;
    if(q.kind==="gram"){good=i===0;picked=q.item[2][i];correct=q.item[2][0]}
    else{good=q.opts[i]===q.item;picked=q.kind==="vocab"?q.opts[i][2]:q.opts[i][0];correct=q.kind==="vocab"?q.item[2]:q.item[0]}
    if(test){b.classList.add("picked");setTimeout(()=>onDone(good,picked,correct),250);return}
    b.classList.add(good?"right":"wrong");
    const ci=q.kind==="gram"?0:q.opts.indexOf(q.item);if(!good)C.querySelector(`[data-i="${ci}"]`).classList.add("right");
    mark(q.key,good);
    let ex="";
    if(q.kind==="listen")ex=`<div class="zh">${esc(q.item[1])}</div><div class="py">${esc(q.item[2])}</div>`;
    else if(q.kind==="vocab")ex=`<div class="py" style="font-size:18px">${esc(q.item[1])}　${esc(q.item[2])}</div>`;
    else ex=`<div class="note">${esc(q.item[3])}<br>${esc(fullSentence(q.item))}</div>`;
    $("ans").innerHTML=ex+`<div class="row"><button class="btn" id="again">🔊</button><button class="btn sm" id="hint">📖</button>${q.lid?`<button class="btn sm" id="les">文法解説</button>`:""}<button class="btn main" id="nx">次へ</button></div>`;
    $("ans").classList.remove("hide");$("again").onclick=()=>say(speakText);
    $("hint").onclick=()=>help(q.kind==="vocab"?q.item[0]:q.kind==="listen"?q.item[1]:fullSentence(q.item),q.lid);
    if($("les"))$("les").onclick=()=>lessonSheet(q.lid);
    $("nx").onclick=onDone;
    if(q.kind!=="listen")say(speakText);
  });
}

// ---------- 文法 ----------
function lessonAcc(id){let o=0,x=0;for(const g of GQ)if(g[0]===id){const h=hist[gkey(g)];if(h){o+=h[0];x+=h[1]}}return o+x?Math.round(o*100/(o+x))+"%":"—"}
function gramMenu(){
  C.innerHTML=`<div class="row" style="margin-top:0"><button class="btn main" id="rnd">🎲 ランダム問題</button></div><div class="small" style="margin:12px 0 4px">課を選んで解説を読む（右は正答率）</div><div>${L.map(l=>`<button class="lesson" data-id="${l.id}">${l.id.slice(1)}. ${esc(l.t)}<span class="p">${lessonAcc(l.id)}</span></button>`).join("")}</div>`;
  $("rnd").onclick=()=>gramRandom();
  C.querySelectorAll(".lesson").forEach(b=>b.onclick=()=>lessonView(b.dataset.id));
}
function lessonView(id){
  const l=LMAP[id];const qs=GQ.filter(g=>g[0]===id);
  C.innerHTML=`<button class="lk" id="back">← 一覧へ</button><div style="margin-top:10px">${lessonHTML(l)}</div><div class="row"><button class="btn main" id="go">この課の問題（${qs.length}問）</button></div>`;
  bindEx(C);$("back").onclick=gramMenu;
  $("go").onclick=()=>{let i=0;const order=shuffle(qs);const step=()=>{if(i>=order.length){C.innerHTML=`<div class="big">✓</div><div style="text-align:center">${esc(l.t)} 完了<br>正答率 ${lessonAcc(id)}</div><div class="row"><button class="btn" id="re">もう一度解説</button><button class="btn main" id="mn">一覧へ</button></div>`;$("re").onclick=()=>lessonView(id);$("mn").onclick=gramMenu;return}
    renderMC(gramQ(order[i]),{head:`<div class="small">${esc(l.t)}　${i+1}/${order.length}</div>`,onDone:()=>{i++;step()}})};step()};
  window.scrollTo(0,0);
}
function gramRandom(){renderMC(gramQ(pick(GQ,gkey)),{head:`<button class="lk" id="back">← 一覧へ</button><div style="height:8px"></div>`,onDone:gramRandom});$("back").onclick=gramMenu}

// ---------- 単語 ----------
function vocabMenu(q=""){
  const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z]/g,"");
  const qn=norm(q);
  const f=q?V.filter(v=>v[0].includes(q)||v[2].includes(q)||(qn&&norm(v[1]).includes(qn))):V;
  C.innerHTML=`<div class="row" style="margin-top:0"><button class="btn main" id="fc">🃏 単語カード</button><button class="btn" id="mc">4択クイズ</button></div><div style="margin-top:12px"><input type="search" id="q" placeholder="漢字・ピンイン・日本語で検索" value="${esc(q)}"></div><div class="small" style="margin-top:6px">${f.length}語</div><div class="list" id="vl">${f.slice(0,80).map(v=>`<div class="item"><div><div class="h">${esc(v[0])}</div><div class="m">${esc(v[1])}　${esc(v[2])}</div></div><button class="btn sm" data-say="${esc(v[0])}">🔊</button></div>`).join("")}${f.length>80?`<div class="small" style="padding:8px">…ほか${f.length-80}語（検索で絞り込めます）</div>`:""}</div>`;
  bindEx(C);$("fc").onclick=flash;$("mc").onclick=vocabQuiz;
  const inp=$("q");inp.oninput=()=>{const v=inp.value;clearTimeout(window._t);window._t=setTimeout(()=>{vocabMenu(v);const n=$("q");n.focus();n.setSelectionRange(v.length,v.length)},250)};
}
function flash(){
  const v=pick(V,x=>"v:"+x[0]);
  C.innerHTML=`<button class="lk" id="back">← 単語一覧</button><div class="zh" style="font-size:44px;text-align:center;margin:24px 0 8px">${esc(v[0])}</div><div id="ans" class="hide" style="text-align:center"><div class="py" style="font-size:20px">${esc(v[1])}</div><div class="jp" style="margin-top:6px">${esc(v[2])}</div></div>
  <div class="row" id="r1"><button class="btn main" id="show">答えを見る</button></div><div class="row hide" id="r3"><button class="btn" id="play">🔊</button><button class="btn ng" id="ng">✕ 知らない</button><button class="btn ok" id="ok">○ 分かった</button></div>`;
  $("back").onclick=()=>vocabMenu();
  $("show").onclick=()=>{$("ans").classList.remove("hide");$("r3").classList.remove("hide");$("r1").classList.add("hide");say(v[0])};
  $("play").onclick=()=>say(v[0]);
  $("ok").onclick=()=>{mark("v:"+v[0],true);flash()};$("ng").onclick=()=>{mark("v:"+v[0],false);flash()};
}
function vocabQuiz(){renderMC(vocabQ(pick(V,x=>"v:"+x[0])),{head:`<button class="lk" id="back">← 単語一覧</button><div style="height:8px"></div>`,onDone:vocabQuiz});$("back").onclick=()=>vocabMenu()}

// ---------- テスト ----------
function testMenu(){
  const last=tests.slice(-5).reverse();
  C.innerHTML=`<h2>実力テスト</h2><div class="body small">文法・単語・聞き取りから出題します。途中で答えは表示されません。最後に結果と弱点が出ます。
結果は「コピー」してチャットに貼れば、弱点を分析してもらえます。</div>
<div class="row"><button class="btn main" data-n="30">30問（約10分）</button><button class="btn" data-n="60">60問（約20分）</button></div>
<div class="row"><button class="btn" data-n="15">15問ミニ</button></div>
${last.length?`<div class="small" style="margin-top:14px">最近の結果</div>${last.map(t=>`<div class="small">${esc(t.d)}　${t.ok}/${t.n}（${Math.round(t.ok*100/t.n)}%）</div>`).join("")}`:""}`;
  C.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>startTest(+b.dataset.n));
}
function startTest(n){
  const ng=Math.round(n*0.4),nv=Math.round(n*0.4),nl=n-ng-nv;
  const qs=shuffle([...shuffle(GQ).slice(0,ng).map(gramQ),...shuffle(V).slice(0,nv).map(vocabQ),...shuffle(S).slice(0,nl).map(listenQ)]);
  const res=[];let i=0;
  const step=()=>{
    if(i>=qs.length)return finishTest(qs,res);
    renderMC(qs[i],{test:true,head:`<div class="prog"><i style="width:${i*100/qs.length}%"></i></div><div class="bar" style="margin-bottom:6px"><span>${i+1}/${qs.length}　${qs[i].cat}</span><button class="lk" id="quit">中断</button></div>`,onDone:(good,picked,correct)=>{res.push({good,picked,correct});i++;step()}});
    $("quit").onclick=()=>{if(res.length)finishTest(qs.slice(0,res.length),res);else testMenu()};
  };step();
}
function qText(q){return q.kind==="gram"?q.item[1]:q.kind==="vocab"?`${q.item[0]}（${q.item[1]}）`:`[音声] ${q.item[1]}`}
function finishTest(qs,res){
  stop();
  qs.forEach((q,k)=>mark(q.key,res[k].good));
  const n=res.length,ok=res.filter(r=>r.good).length;
  const by={};qs.forEach((q,k)=>{const c=q.cat;by[c]=by[c]||[0,0];by[c][1]++;if(res[k].good)by[c][0]++});
  const byL={};qs.forEach((q,k)=>{if(q.kind!=="gram")return;const t=LMAP[q.lid].t;byL[t]=byL[t]||[0,0];byL[t][1]++;if(res[k].good)byL[t][0]++});
  const d=new Date();const ds=`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`;
  tests.push({d:ds,n,ok,by});tests=tests.slice(-30);save();
  let txt=`【HSK4テスト結果】${ds}\n正答 ${ok}/${n}（${Math.round(ok*100/n)}%）\n分野別：${Object.entries(by).map(([c,v])=>`${c} ${v[0]}/${v[1]}`).join("、")}\n`;
  const weakL=Object.entries(byL).filter(([t,v])=>v[0]<v[1]);
  if(weakL.length)txt+=`間違えた文法：${weakL.map(([t,v])=>`${t}（${v[0]}/${v[1]}）`).join("、")}\n`;
  txt+=`\n■ 全問の結果\n`+qs.map((q,k)=>`${res[k].good?"○":"✕"} [${q.cat}${q.kind==="gram"?"・"+q.lid:""}] ${qText(q)}　→ 回答：${res[k].picked}${res[k].good?"":`／正解：${res[k].correct}`}`).join("\n");
  const wrong=qs.map((q,k)=>[q,res[k]]).filter(([q,r])=>!r.good);
  C.innerHTML=`<h2>結果：${ok}/${n}（${Math.round(ok*100/n)}%）</h2><div class="small">${Object.entries(by).map(([c,v])=>`${c} ${v[0]}/${v[1]}`).join("　")}</div>
  <div class="row"><button class="btn main" id="cp">📋 結果をコピー</button><button class="btn" id="mn">テスト一覧</button></div><div id="cpmsg" class="small"></div>
  ${wrong.length?`<div class="small" style="margin-top:14px">間違えた問題（${wrong.length}）</div><div class="list">${wrong.map(([q,r])=>`<div class="item" style="display:block"><div>${esc(qText(q))}</div><div class="m">あなた：${esc(r.picked)}　正解：<b>${esc(r.correct)}</b>${q.kind==="gram"?`　<button class="lk" data-lesson="${q.lid}">解説</button>`:""}</div></div>`).join("")}</div>`:`<div class="big">🎉</div>`}`;
  $("mn").onclick=testMenu;$("cp").onclick=()=>copyText(txt);
  C.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>lessonSheet(b.dataset.lesson));
}
function copyText(txt){
  const fallback=()=>openSheet(`<h2>コピー</h2><div class="small">下の文字を長押し→「すべてを選択」→「コピー」してください。</div><textarea id="ta" readonly>${esc(txt)}</textarea>`);
  try{navigator.clipboard.writeText(txt).then(()=>{const m=$("cpmsg");if(m)m.textContent="✓ コピーしました。チャットに貼り付けてください。";else fallback()},fallback)}catch(e){fallback()}
}

// ---------- 苦手・記録 ----------
function weakMenu(){
  const ws=Object.entries(weak).filter(([k,v])=>v>0);
  const cnt={s:0,l:0,g:0,v:0};ws.forEach(([k])=>cnt[k[0]]++);
  C.innerHTML=`<h2>苦手・記録</h2><div class="small">苦手：作文 ${cnt.s}／聞き取り ${cnt.l}／文法 ${cnt.g}／単語 ${cnt.v}</div>
  <div class="row"><button class="btn main" id="rv">苦手だけ復習</button></div>
  <div class="row"><button class="btn" id="rep">📋 弱点レポートをコピー</button></div><div id="cpmsg" class="small"></div>
  <div class="small" style="margin-top:14px;line-height:1.6">レポートには、文法の課ごとの正答率、苦手な問題、テストの履歴が入ります。チャットに貼ると、次に何をやるべきか分析できます。</div>`;
  $("rv").onclick=weakReview;$("rep").onclick=()=>copyText(report());
}
function report(){
  const acc=k=>{const h=hist[k];return h?`${h[0]}/${h[0]+h[1]}`:"—"};
  let t=`【中国語トレーナー 弱点レポート】\n練習した数：${done}\n`;
  const sums={作文:[0,0],聞き取り:[0,0],文法:[0,0],単語:[0,0]};const nm={s:"作文",l:"聞き取り",g:"文法",v:"単語"};
  for(const [k,h] of Object.entries(hist)){const c=nm[k[0]];if(c){sums[c][0]+=h[0];sums[c][1]+=h[0]+h[1]}}
  t+=`分野別正答：${Object.entries(sums).map(([c,v])=>`${c} ${v[0]}/${v[1]}`).join("、")}\n\n■ 文法（課ごとの正答率）\n`;
  t+=L.map(l=>`${l.id} ${l.t}：${lessonAcc(l.id)}`).join("\n");
  const ws=Object.entries(weak).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,60);
  const label=k=>{const p=k[0],b=k.slice(2);if(p==="v"){const v=V.find(x=>x[0]===b);return `単語 ${b}${v?`（${v[1]} ${v[2]}）`:""}`}if(p==="g"){const g=GQ.find(x=>gkey(x)===k);return `文法${g?"・"+g[0]:""} ${g?g[1]:b}${g?` 正解:${g[2][0]}`:""}`}const s=S.find(x=>x[1]===b);return `${p==="s"?"作文":"聞き取り"} ${b}${s?`（${s[0]}）`:""}`};
  t+=`\n\n■ 苦手な問題（多い順）\n`+(ws.length?ws.map(([k,v])=>`${label(k)}　正答 ${acc(k)}`).join("\n"):"なし");
  if(tests.length)t+=`\n\n■ テスト履歴\n`+tests.slice(-10).map(x=>`${x.d} ${x.ok}/${x.n}（${Object.entries(x.by).map(([c,v])=>`${c}${v[0]}/${v[1]}`).join(" ")}）`).join("\n");
  return t;
}
function weakReview(){
  const ws=[...S.filter(x=>(weak["s:"+x[1]]||0)>0).map(x=>["s",x]),...S.filter(x=>(weak["l:"+x[1]]||0)>0).map(x=>["l",x]),...GQ.filter(x=>(weak[gkey(x)]||0)>0).map(x=>["g",x]),...V.filter(x=>(weak["v:"+x[0]]||0)>0).map(x=>["v",x])];
  if(!ws.length){C.innerHTML=`<div class="big">🎉</div><div style="text-align:center">苦手はゼロです。</div><div class="row"><button class="btn" id="bk">戻る</button></div>`;$("bk").onclick=weakMenu;return}
  const [k,x]=ws[Math.random()*ws.length|0];
  if(k==="s")comp(x,weakReview);else renderMC(k==="l"?listenQ(x):k==="g"?gramQ(x):vocabQ(x),{head:`<div class="small">苦手復習　残り${ws.length}</div>`,onDone:weakReview});
}

// ---------- 画面切り替え ----------
const desc={auto:"聞き流し・ハンズフリー練習",comp:"日本語を見て3秒以内に中国語で言う",listen:"音声だけで意味を選ぶ",gram:"解説を読んで問題を解く",vocab:"検索・カード・4択",test:"答えは最後にまとめて表示",weak:"苦手の復習と結果のコピー"};
function next(){
  stop();
  if(mode==="auto")autoMenu();
  else if(mode==="comp")comp(pick(S,x=>"s:"+x[1]));
  else if(mode==="listen")renderMC(listenQ(pick(S,x=>"l:"+x[1])),{onDone:next});
  else if(mode==="gram")gramMenu();
  else if(mode==="vocab")vocabMenu();
  else if(mode==="test")testMenu();
  else weakMenu();
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");if(mode==="auto")autoStop();mode=b.dataset.m;$("mode-desc").textContent=desc[mode];closeSheet();next()});
document.querySelectorAll(".speed button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".speed button").forEach(x=>x.classList.remove("on"));b.classList.add("on");rate=+b.dataset.r});
$("mode-desc").textContent=desc[mode];stat();next();
const off=$("off");
if("serviceWorker" in navigator&&navigator.serviceWorker.controller){let rl=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(rl||autoRun.on)return;rl=true;location.reload()})}
if("serviceWorker" in navigator){navigator.serviceWorker.register("/hsk4/sw.js",{scope:"/hsk4/"}).then(r=>{try{r.update()}catch(e){}return navigator.serviceWorker.ready}).then(()=>{off.textContent="✓ オフラインで使えます（v3）"}).catch(()=>{off.textContent="オフライン保存に失敗しました（通信がある所で再読み込みしてください）"})}else{off.textContent="このブラウザはオフライン保存に未対応です"}
</script>
