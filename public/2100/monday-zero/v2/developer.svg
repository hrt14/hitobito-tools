<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><defs><linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf5fc"/><stop offset="1" stop-color="#d7e9f7"/></linearGradient></defs><rect width="1200" height="700" fill="url(#r)"/><g transform="translate(730 85)"><circle cx="175" cy="110" r="82" fill="#d7ae9c"/><path d="M92 90q80-125 170 0q-45-30-92-28q-48 0-78 28" fill="#111820"/><path d="M70 220q105-80 210 0l40 380H30z" fill="#102036"/><rect x="88" y="350" width="230" height="250" rx="38" fill="#0b1522" stroke="#2587ff" stroke-width="3"/><text x="110" y="270" font-family="Arial,sans-serif" font-size="15" fill="#9fc8f3">2100 FUTURE LAB</text></g><g font-family="Arial,'Noto Sans JP',sans-serif" fill="#092449"><text x="70" y="100" font-size="18" font-weight="800" fill="#0759d9">DEVELOPER MESSAGE</text><text x="70" y="190" font-size="46" font-weight="900">「私たちが軽くしたいのは、</text><text x="70" y="255" font-size="46" font-weight="900">バッグではありません。</text><text x="70" y="320" font-size="46" font-weight="900">月曜日そのものです。」</text><text x="70" y="420" font-size="20" font-weight="800">相澤 ケンジ</text><text x="70" y="452" font-size="15" fill="#66788d">2100 FUTURE LAB 代表 / 架空開発責任者</text><text x="70" y="525" font-size="17" fill="#66788d">最初の試作品は18kg。100回以上の改良を重ねても、</text><text x="70" y="558" font-size="17" fill="#66788d">月曜日そのものは消せませんでした。</text><text x="70" y="591" font-size="17" fill="#66788d">だから、少しだけ軽くすることにしました。</text></g></svg>