<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690"><rect width="1200" height="690" fill="#f7fbff"/><g font-family="Arial,'Noto Sans JP',sans-serif"><text x="70" y="70" font-size="18" font-weight="800" fill="#0759d9">ONE DAY STORY</text><text x="70" y="122" font-size="42" font-weight="900" fill="#092449">月曜日を、少しだけ軽くする一日。</text></g><g transform="translate(42 170)" font-family="Arial,'Noto Sans JP',sans-serif"><g><rect width="210" height="430" rx="20" fill="white" stroke="#d2e1f2"/><text x="22" y="45" font-size="30" font-weight="900" fill="#0759d9">1</text><text x="62" y="43" font-size="20" font-weight="800" fill="#092449">自宅</text><circle cx="105" cy="175" r="46" fill="#d8e7f5"/><rect x="68" y="210" width="75" height="120" rx="18" fill="#111b29"/><rect x="86" y="245" width="110" height="145" rx="22" fill="#0c1725"/><text x="105" y="405" text-anchor="middle" font-size="14" fill="#60738a">今日も月曜日か。</text></g><g transform="translate(224)"><rect width="210" height="430" rx="20" fill="white" stroke="#d2e1f2"/><text x="22" y="45" font-size="30" font-weight="900" fill="#0759d9">2</text><text x="62" y="43" font-size="20" font-weight="800" fill="#092449">駅</text><path d="M20 300L190 130M10 360L180 190" stroke="#9dc4ea" stroke-width="10"/><rect x="85" y="170" width="85" height="140" rx="22" fill="#101a27"/><circle cx="105" cy="125" r="35" fill="#e3c2b2"/><text x="105" y="405" text-anchor="middle" font-size="14" fill="#60738a">肩の重さが違う。</text></g><g transform="translate(448)"><rect width="210" height="430" rx="20" fill="white" stroke="#d2e1f2"/><text x="22" y="45" font-size="30" font-weight="900" fill="#0759d9">3</text><text x="62" y="43" font-size="20" font-weight="800" fill="#092449">電車</text><rect x="20" y="110" width="170" height="250" rx="30" fill="#e5eef7"/><path d="M40 150h130M40 190h130" stroke="#aac5df" stroke-width="8"/><circle cx="95" cy="180" r="32" fill="#e3c2b2"/><rect x="82" y="220" width="90" height="125" rx="22" fill="#101a27"/><text x="105" y="405" text-anchor="middle" font-size="14" fill="#60738a">立っていても余白。</text></g><g transform="translate(672)"><rect width="210" height="430" rx="20" fill="white" stroke="#d2e1f2"/><text x="22" y="45" font-size="30" font-weight="900" fill="#0759d9">4</text><text x="62" y="43" font-size="20" font-weight="800" fill="#092449">会社</text><rect x="25" y="100" width="160" height="260" rx="10" fill="#d9e7f4"/><g fill="#8ab4db"><rect x="45" y="125" width="35" height="45"/><rect x="100" y="125" width="35" height="45"/><rect x="45" y="190" width="35" height="45"/><rect x="100" y="190" width="35" height="45"/></g><circle cx="95" cy="290" r="28" fill="#e3c2b2"/><rect x="80" y="315" width="95" height="55" rx="15" fill="#101a27"/><text x="105" y="405" text-anchor="middle" font-size="14" fill="#60738a">重力は同じ。気分は違う。</text></g><g transform="translate(896)"><rect width="210" height="430" rx="20" fill="white" stroke="#d2e1f2"/><text x="22" y="45" font-size="30" font-weight="900" fill="#0759d9">5</text><text x="62" y="43" font-size="20" font-weight="800" fill="#092449">帰宅</text><circle cx="160" cy="125" r="50" fill="#ffcf7c" opacity=".65"/><path d="M20 310L190 220" stroke="#9dc4ea" stroke-width="12"/><circle cx="90" cy="220" r="32" fill="#e3c2b2"/><rect x="75" y="255" width="95" height="110" rx="20" fill="#101a27"/><text x="105" y="405" text-anchor="middle" font-size="14" fill="#60738a">明日は火曜日。</text></g></g></svg>