<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" role="img" aria-labelledby="t d"><title id="t">細かいギミックまで、未来っぽく。</title><desc id="d">MONDAY ZERO BAGの未来ギミック解説</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#e2efff"/></linearGradient><linearGradient id="bag" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2b3c52"/><stop offset="1" stop-color="#081421"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#163d6a" flood-opacity=".22"/></filter></defs><rect width="1440" height="1080" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif"><text x="72" y="115" font-size="62" font-weight="900" fill="#08264c">細かいギミックまで、未来っぽく。</text><text x="76" y="164" font-size="20" font-weight="800" fill="#1267e8" letter-spacing="3">MONDAY ZERO BAG / FEATURE MAP</text></g><g transform="translate(520 220)" filter="url(#shadow)"><path d="M120 100 C150 35 275 24 320 99" fill="none" stroke="#0d1d2d" stroke-width="27" stroke-linecap="round"/><rect x="60" y="90" width="360" height="650" rx="70" fill="url(#bag)"/><rect x="88" y="122" width="305" height="590" rx="55" fill="none" stroke="#405a75" stroke-width="3"/><path d="M122 155V655" stroke="#1267e8" stroke-width="5"/><circle cx="132" cy="280" r="9" fill="#1267e8"/><rect x="158" y="635" width="170" height="30" rx="15" fill="#0e1c2e"/><text x="243" y="656" text-anchor="middle" fill="#4c9dff" font-family="sans-serif" font-size="13" font-weight="800">MONDAY ZERO</text></g><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif"><rect x="72" y="260" width="360" height="235" rx="24" fill="#fff" stroke="#b6d4f5" stroke-width="2"/><text x="105" y="310" font-size="26" font-weight="900" fill="#1267e8">1. GRAVITY SHIFT™</text><text x="105" y="354" font-size="24" font-weight="800" fill="#08264c">荷重を下へ分散。</text><text x="105" y="392" font-size="20" fill="#64748b">肩・背中・気分に偏る負荷を</text><text x="105" y="423" font-size="20" fill="#64748b">架空の重力場として再配分。</text><path d="M360 452 C440 475 495 470 575 435" fill="none" stroke="#1267e8" stroke-width="3" stroke-dasharray="10 9"/><circle cx="578" cy="434" r="8" fill="#1267e8"/><rect x="1010" y="240" width="355" height="225" rx="24" fill="#fff" stroke="#b6d4f5" stroke-width="2"/><text x="1040" y="290" font-size="26" font-weight="900" fill="#1267e8">2. MONDAY MODE</text><text x="1040" y="336" font-size="24" font-weight="800" fill="#08264c">月曜日だけ、本気。</text><text x="1040" y="376" font-size="20" fill="#64748b">祝日・代休・時差まで判定。</text><text x="1040" y="407" font-size="20" fill="#64748b">月曜の朝だけ補正を最大化。</text><path d="M1008 420 C935 435 900 430 850 400" fill="none" stroke="#1267e8" stroke-width="3" stroke-dasharray="10 9"/><circle cx="848" cy="400" r="8" fill="#1267e8"/><rect x="1010" y="545" width="355" height="225" rx="24" fill="#fff" stroke="#b6d4f5" stroke-width="2"/><text x="1040" y="595" font-size="26" font-weight="900" fill="#1267e8">3. TUESDAY MODE</text><text x="1040" y="641" font-size="24" font-weight="800" fill="#08264c">火曜日は普通。</text><text x="1040" y="681" font-size="20" fill="#64748b">未来技術は静かに休止。</text><text x="1040" y="712" font-size="20" fill="#64748b">ちゃんと優秀なバッグに戻ります。</text><path d="M1010 620 C945 605 900 600 858 580" fill="none" stroke="#1267e8" stroke-width="3" stroke-dasharray="10 9"/><circle cx="854" cy="579" r="8" fill="#1267e8"/></g><g transform="translate(90 670)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif"><rect width="330" height="250" rx="24" fill="#071d39"/><text x="32" y="55" font-size="18" font-weight="900" fill="#73b2ff">MENTAL WEIGHT SENSOR</text><path d="M45 155 C85 85 145 210 190 120 S270 75 300 140" fill="none" stroke="#42a1ff" stroke-width="6"/><circle cx="190" cy="120" r="10" fill="#42a1ff"/><text x="32" y="215" font-size="17" fill="#c6d6e9">行きたくなさを、励ましすぎない程度に検知。</text></g><g transform="translate(470 845)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif"><rect width="850" height="120" rx="22" fill="#fff" stroke="#b6d4f5" stroke-width="2"/><g fill="#1267e8"><circle cx="80" cy="60" r="30"/><circle cx="300" cy="60" r="30"/><circle cx="520" cy="60" r="30"/><circle cx="740" cy="60" r="30"/></g><g font-size="16" font-weight="800" fill="#08264c"><text x="125" y="55">自動軽量化</text><text x="345" y="55">会社接近検知</text><text x="565" y="55">帰宅時ブースト</text><text x="785" y="55">上司接近通知</text></g></g></svg>